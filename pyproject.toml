[project]
name = "ola-data-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chinmay0502", email = "chinamayakumarsahoo@gmai.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.143.0",
    "ipython>=9.17.1",
    "langchain>=1.4.4",
    "langchain-gemini>=0.1.1",
    "langchain-google-genai>=4.4.1",
    "langchain-groq>=1.1.3",
    "langchain-mistralai>=1.1.6",
    "langgraph>=1.2.14",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ola-data-agent = "ola_data_agent:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
